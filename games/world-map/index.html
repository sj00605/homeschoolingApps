<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Map</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b2a4c;--soft:#6f6c8f;--edge:#d9e6ef}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{font-family:'Andika',system-ui,sans-serif;color:var(--ink);background:#f3f8fc;display:flex;flex-direction:column;align-items:center;user-select:none}
  header{width:100%;max-width:1200px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 2px;flex-wrap:wrap}
  h1{font-size:clamp(22px,4vw,30px);margin:0}
  .name{height:clamp(54px,9vw,80px);display:flex;align-items:center;justify-content:center;font-size:clamp(36px,7vw,64px);font-weight:700;letter-spacing:.5px}
  .name span{display:inline-block;padding:0 26px;border-radius:999px;color:#fff;animation:pop .35s ease-out}
  .name .hint{color:var(--soft);font-size:clamp(20px,4vw,28px);font-weight:400;animation:none;padding:0}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .board{width:min(1200px,100%);padding:0 10px}
  svg#map{width:100%;height:auto;max-height:76vh;display:block;border-radius:22px;box-shadow:inset 0 0 0 3px #a9d6ee}
  .land{cursor:pointer;stroke:#fff;stroke-width:1.2;stroke-linejoin:round;transition:filter .2s, opacity .2s}
  .land:hover{filter:brightness(1.08)}
  .land.picked{stroke:#2b2a4c;stroke-width:2.2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25)) brightness(1.06)}
  .dim .land:not(.picked){opacity:.55}
  .lbl{font-family:Andika,sans-serif;font-weight:700;fill:#2b2a4c;stroke:#fff;stroke-width:6px;paint-order:stroke;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .lbl.small{font-size:20px} .lbl.big{font-size:34px}
  .lbl.popin{animation:lblpop .35s ease-out;transform-box:fill-box;transform-origin:center}
  @keyframes lblpop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  footer{display:flex;gap:8px;padding:12px 12px 20px;flex-wrap:wrap;justify-content:center}
  .pill{font-family:inherit;font-size:16px;border:2px solid var(--edge);background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;color:var(--ink)}
  .pill.on{border-color:#46c2b8;background:#e6f7f5}
</style>
</head>
<body>
<header><h1>🌍 World Map</h1></header>
<div class="name" id="name"><span class="hint">Tap a continent!</span></div>
<div class="board">
  <svg id="map" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9dcf5"/><stop offset="1" stop-color="#7cc6ea"/></linearGradient>
    </defs>
    <rect id="ocean" x="0" y="0" fill="url(#sea)"/>
    <g id="grid" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"></g>
    <g id="lands"></g>
    <g id="labels"></g>
  </svg>
</div>
<footer>
  <button class="pill" id="allBtn">🏷️ Show all names</button>
  <button class="pill" id="sayBtn">🔊 Say it again</button>
  <button class="pill on" id="talkBtn">🗣️ Talking: on</button>
</footer>

// Plays pre-recorded voice clips (Amy) through Web Audio so it works on phones and tablets after the first tap.
const Voice=(()=>{
  let ac=null, cache={}, token=0, src=null;
  function ctx(){
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") try{ac.resume()}catch(e){}
    return ac;
  }
  function buf(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
  function load(id){
    if(!cache[id]){
      const d=VOICE_CLIPS[id];
      cache[id]= d ? new Promise(res=>{try{ctx().decodeAudioData(buf(d),res,()=>res(null))}catch(e){res(null)}}) : Promise.resolve(null);
    }
    return cache[id];
  }
  function stop(){ token++; try{src&&src.stop()}catch(e){} src=null; }
  let current=Promise.resolve();
  function play(ids){ current=run(ids); return current; }
  // wait for whatever is playing to finish, then play (used for automatic prompts)
  function after(ids){ return current.then(()=>play(ids)); }
  async function run(ids){
    ids=[].concat(ids); stop(); const t=token; ctx();
    for(const id of ids){
      const b=await load(id); if(t!==token) return; if(!b) continue;
      await new Promise(r=>{src=ctx().createBufferSource();src.buffer=b;src.connect(ctx().destination);src.onended=r;src.start();});
      if(t!==token) return;
    }
  }
  function warm(){ ctx(); Object.keys(VOICE_CLIPS).forEach((id,i)=>setTimeout(()=>load(id),i*10)); }
  return {play,after,stop,warm,ctx};
})();

const CONTINENTS = [
  {id:"northAmerica", name:"North America", color:"#ef6f6c"},
  {id:"southAmerica", name:"South America", color:"#f2b632"},
  {id:"europe",       name:"Europe",        color:"#a77bf3"},
  {id:"africa",       name:"Africa",        color:"#f58f4a"},
  {id:"asia",         name:"Asia",          color:"#5cbf73"},
  {id:"australia",    name:"Australia",     color:"#ee7fb0"},
  {id:"antarctica",   name:"Antarctica",    color:"#c9d9ea"}
];
const NS="http://www.w3.org/2000/svg", $=id=>document.getElementById(id);
let picked=null, showAll=false, talking=true;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function say(id,force){ if(!talking&&!force) return; Voice.play(id); }

const svg=$("map");
svg.setAttribute("viewBox",`0 0 ${MAP.W} ${MAP.H}`);
svg.style.maxWidth=`calc(76vh * ${MAP.W/MAP.H})`; svg.style.margin="0 auto";
$("ocean").setAttribute("width",MAP.W); $("ocean").setAttribute("height",MAP.H);
// faint grid lines
for(let x=0;x<=MAP.W;x+=MAP.W/12) el("line",{x1:x,y1:0,x2:x,y2:MAP.H},$("grid"));
for(let y=MAP.H/8;y<MAP.H;y+=MAP.H/8) el("line",{x1:0,y1:y,x2:MAP.W,y2:y},$("grid"));

CONTINENTS.forEach(c=>{
  const p=el("path",{d:MAP.paths[c.id],class:"land",fill:c.color,"fill-rule":"evenodd",id:"land-"+c.id,"aria-label":c.name,role:"button"},$("lands"));
  p.addEventListener("click",()=>pick(c));
});

function drawLabels(){
  const g=$("labels"); g.innerHTML="";
  CONTINENTS.forEach(c=>{
    if(!showAll && picked!==c) return;
    const [x,y]=MAP.labels[c.id];
    const t=el("text",{x,y,class:"lbl "+(picked===c?"big popin":"small")},g);
    t.textContent=c.name;
  });
}
function pick(c){
  Voice.ctx();
  picked=c;
  document.querySelectorAll(".land").forEach(p=>p.classList.toggle("picked",p.id==="land-"+c.id));
  svg.classList.add("dim");
  $("lands").appendChild($("land-"+c.id));          // bring to front so its outline shows
  $("name").innerHTML=`<span style="background:${c.id==="antarctica"?"#7aa6cf":c.color}">${c.name}</span>`;
  drawLabels();
  say(c.id);
}
// tap the ocean to clear
$("ocean").addEventListener("click",()=>{ picked=null; svg.classList.remove("dim");
  document.querySelectorAll(".land").forEach(p=>p.classList.remove("picked"));
  $("name").innerHTML=`<span class="hint">Tap a continent!</span>`; drawLabels(); });

$("allBtn").onclick=()=>{ showAll=!showAll; $("allBtn").classList.toggle("on",showAll);
  $("allBtn").textContent=showAll?"🏷️ Hide names":"🏷️ Show all names"; drawLabels(); };
$("sayBtn").onclick=()=>{ if(picked) say(picked.id,true); else say("intro",true); };
$("talkBtn").onclick=()=>{ talking=!talking; if(!talking) Voice.stop();
  $("talkBtn").classList.toggle("on",talking); $("talkBtn").textContent=`🗣️ Talking: ${talking?"on":"off"}`; };
document.addEventListener("pointerdown",()=>Voice.warm(),{once:true});
drawLabels();
</script>
